<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Liên hệ — Rune Studio</title>
<meta name="description" content="Gửi brief dự án cho Rune Studio, hoặc nhắn nhanh qua Zalo / Messenger. Phản hồi trong 24 giờ làm việc.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Rune Studio">
<meta property="og:title" content="Liên hệ — Rune Studio">
<meta property="og:description" content="Gửi brief dự án cho Rune Studio, hoặc nhắn nhanh qua Zalo / Messenger. Phản hồi trong 24 giờ làm việc.">
<meta property="og:image" content="https://runestudio.art/assets/uploads/share.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="canonical" href="https://runestudio.art/lien-he.html">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="header"></div>
<section class="page-hero"><div class="wrap">
  <h1 id="p-ct-title">Liên hệ</h1>
  <p class="lead" id="p-ct-lead"></p>
</div></section>
<section class="section"><div class="wrap contact-grid">
  <div>
    <div class="contact-links">
      <a data-contact="zalo" href="#" target="_blank" rel="noopener"><span id="p-ct-zalo">Nhắn Zalo</span><span>→</span></a>
      <a data-contact="messenger" href="#" target="_blank" rel="noopener"><span id="p-ct-mess">Nhắn Messenger</span><span>→</span></a>
      <a href="#" data-site="email"><span data-site="email">hello@runestudio.vn</span><span>→</span></a>
      <a href="#" data-site="phone"><span data-site="phone">0900 000 000</span><span>→</span></a>
    </div>
    <p class="small" style="margin-top:20px"><span data-site="address">Biên Hòa, Đồng Nai</span> · <span data-site="hours">Làm việc thứ 2 – thứ 7, 9:00 – 18:00</span></p>
  </div>
  <div class="brief" id="project-brief">
    <h3 id="p-form-title">Project Brief</h3>
    <p class="small" id="p-form-lead" style="margin:8px 0 4px"></p>

    <form class="form" id="brief-form" novalidate>
      <p class="hp"><label>Đừng điền ô này: <input name="botcheck" tabindex="-1" autocomplete="off"></label></p>

      <div id="brief-fields"></div>

      <button class="btn btn--signal" type="submit" id="brief-submit"><span id="p-form-btn">Gửi brief</span></button>
      <p class="form-note" id="brief-msg"><span id="p-form-note">Hoặc nhắn nhanh qua</span> <a data-contact="zalo" href="#" target="_blank" rel="noopener" style="text-decoration:underline">Zalo</a> · <a data-contact="messenger" href="#" target="_blank" rel="noopener" style="text-decoration:underline">Messenger</a></p>
    </form>
    <div class="form-ok" id="brief-ok">
      <h3 id="p-form-ok-title">Đã nhận brief của bạn</h3>
      <p id="p-form-ok-body"></p>
    </div>
  </div></section>
<div id="footer"></div>
<script src="js/layout.js"></script>
<script src="js/main.js"></script>
<script>SITE_READY.then(async()=>{ await renderPageText(); await renderBriefFields("#brief-fields"); initBriefForm(); });</script>

</body>
</html>
