<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rune Studio — Sáng tạo để tạo dấu ấn</title>
<meta name="description" content="Nơi những câu chuyện thương hiệu được kể theo cách riêng.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Rune Studio">
<meta property="og:title" content="Rune Studio — Sáng tạo để tạo dấu ấn">
<meta property="og:description" content="Nơi những câu chuyện thương hiệu được kể theo cách riêng.">
<meta property="og:image" content="https://runestudio.art/assets/uploads/share.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="canonical" href="https://runestudio.art/">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="header"></div>

<!-- ===== HERO (nội dung sửa trong /admin → Đầu trang chủ) ===== -->
<section class="hero2" id="hero"><div class="wrap hero2-grid">
  <div class="hero2-left">
    <h1 id="hero-title">Nội dung có người xem, kênh có người mua.</h1>
    <p class="lead" id="hero-sub">Content, TikTok &amp; creative cho thương hiệu Việt.</p>
    <div class="btn-row">
      <a class="btn btn--signal" id="hero-btn1" href="dich-vu.html">Xem dịch vụ <span>→</span></a>
      <a class="btn btn--ghost" id="hero-btn2" data-contact="messenger" href="#" target="_blank" rel="noopener">Tư vấn qua Messenger</a>
    </div>
    <div class="stats" id="hero-stats"></div>
    <a class="highlight" id="hero-highlight" href="du-an.html">
      <div class="ph ph--wide" id="hl-img">Ảnh</div>
      <div class="highlight-body">
        <span class="highlight-label" id="hl-label">Dự án mới nhất</span>
        <h3 id="hl-title">—</h3>
        <p class="small" id="hl-meta1"></p>
        <p class="small" id="hl-meta2"></p>
        <span class="btn btn--ghost btn--sm" id="hl-btn">Xem dự án</span>
      </div>
    </a>
  </div>
  <div class="hero2-right">
    <div class="poster" id="hero-poster"><div class="ph ph--square ph--dark">Poster / key visual</div></div>
  </div>
</div>
<div class="ticker"><div class="ticker-track" id="h-ticker"></div></div>
</section>

<!-- Các khối dưới đây lấy nội dung từ /admin → Trang chủ -->
<section class="section" id="about"><div class="wrap two">
  <div><h2 id="h-about-title"></h2><div class="prose lead" id="h-about-body" style="margin-top:20px"></div>
    <a class="btn btn--ghost" id="h-about-btn" href="gioi-thieu.html" style="margin-top:24px"></a></div>
  <div class="ph ph--wide" id="h-about-img">Ảnh</div>
</div></section>

<section class="section section--white" id="services"><div class="wrap">
  <div class="head head--split"><h2 id="h-svc-title"></h2><p class="lead" id="h-svc-lead"></p></div>
  <div class="grid grid-3" id="home-services"></div>
</div></section>

<section class="section" id="solutions"><div class="wrap">
  <div class="head"><h2 id="h-sol-title"></h2></div>
  <div class="rows" id="h-solutions"></div>
</div></section>

<section class="section section--white" id="projects"><div class="wrap">
  <div class="head head--split"><h2 id="h-prj-title"></h2><a class="btn btn--ghost" id="h-prj-btn" href="du-an.html" style="justify-self:end"></a></div>
  <div class="grid grid-4" id="featured"></div>
</div></section>

<section class="section section--dark" id="industries"><div class="wrap">
  <div class="head"><h2 id="h-ind-title"></h2><p class="lead" id="h-ind-lead"></p></div>
  <div class="grid grid-3" id="h-industries"></div>
</div></section>

<section class="section" id="tiktok"><div class="wrap two flip">
  <div><h2 id="h-tt-title"></h2><div class="prose lead" id="h-tt-lead" style="margin-top:20px"></div>
    <ul class="check" id="h-tt-items"></ul>
    <a class="btn" id="h-tt-btn" href="dich-vu.html" style="margin-top:24px"></a></div>
  <div class="grid" id="h-tt-imgs" style="grid-template-columns:1fr 1fr 1fr;gap:12px"></div>
</div></section>

<section class="section section--white" id="gallery"><div class="wrap">
  <div class="head head--split"><h2 id="h-gal-title"></h2><a class="btn btn--ghost" id="h-gal-btn" href="du-an.html" style="justify-self:end"></a></div>
  <div class="gallery" id="h-gallery"></div>
</div></section>

<section class="section" id="case-studies"><div class="wrap">
  <div class="head"><h2 id="h-case-title"></h2></div>
  <div class="grid grid-2" id="h-cases"></div>
</div></section>

<section class="section section--white" id="numbers"><div class="wrap">
  <div class="numbers" id="h-numbers"></div>
</div></section>

<section class="section" id="clients"><div class="wrap">
  <div class="head"><h2 id="h-cli-title"></h2></div>
  <div class="clients" id="h-clients"></div>
</div></section>

<section class="section section--white" id="insights"><div class="wrap">
  <div class="head head--split"><h2 id="h-post-title"></h2><a class="btn btn--ghost" id="h-post-btn" href="tin-tuc.html" style="justify-self:end"></a></div>
  <div id="home-posts"></div>
</div></section>

<section class="cta" id="cta"><div class="wrap">
  <div><h2 id="h-cta-title"></h2><p class="lead" id="h-cta-lead" style="margin-top:12px"></p></div>
  <a class="btn" id="h-cta-btn" href="lien-he.html"></a>
</div></section>

<div id="footer"></div>
<script src="js/layout.js"></script>
<script src="js/main.js"></script>
<script>SITE_READY.then(async()=>{renderPageText();renderHero();await renderHome();renderServiceCards("#home-services");renderProjects("#featured",{featured:true,limit:(window.HOME&&Number(window.HOME.projects_limit))||8});renderPosts("#home-posts",3);});</script>
</body>
</html>
