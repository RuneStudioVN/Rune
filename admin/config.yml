backend:
  name: git-gateway
  branch: main

locale: vi
site_url: /
media_folder: "assets/uploads"
public_folder: "assets/uploads"

collections:
  - name: "site"
    label: "Thông tin chung"
    files:
      - name: "site"
        label: "Liên hệ & mạng xã hội"
        file: "content/site.json"
        fields:
          - { label: "Logo (ảnh nền trong suốt .png/.svg)", name: "logo", widget: "image", required: false, hint: "Để trống = hiện chữ thương hiệu" }
          - { label: "Logo cho footer (nền tối) — để trống thì dùng logo trên", name: "logo_footer", widget: "image", required: false }
          - { label: "Favicon (icon tab trình duyệt, vuông 512x512)", name: "favicon", widget: "image", required: false }
          - { label: "Tên thương hiệu (hiện cạnh logo)", name: "brand", widget: "string" }
          - { label: "Slogan nhỏ dưới tên (header + footer)", name: "slogan", widget: "string", required: false, hint: "VD: Sáng tạo để tạo dấu ấn — xoá trắng thì ẩn" }
          - { label: "Ẩn chữ, chỉ hiện logo", name: "hide_brand_text", widget: "boolean", default: false, required: false }
          - { label: "Mô tả ngắn ở footer", name: "tagline", widget: "string" }
          - { label: "Số điện thoại", name: "phone", widget: "string" }
          - { label: "Email", name: "email", widget: "string" }
          - { label: "Địa chỉ", name: "address", widget: "string" }
          - { label: "Giờ làm việc", name: "hours", widget: "string" }
          - { label: "Link Zalo", name: "zalo", widget: "string", hint: "https://zalo.me/SỐĐIỆNTHOẠI" }
          - { label: "Link Messenger", name: "messenger", widget: "string", hint: "https://m.me/TÊNPAGE" }
          - { label: "Link TikTok", name: "tiktok", widget: "string" }
          - { label: "Link Facebook", name: "facebook", widget: "string" }
          - { label: "Link YouTube", name: "youtube", widget: "string", required: false }
          - { label: "Chữ trong bong bóng góc phải", name: "chat_bubble", widget: "string", required: false }
          - { label: "Mã nhận form (Web3Forms Access Key)", name: "form_key", widget: "string", required: false, hint: "Lấy miễn phí ở web3forms.com — brief khách gửi sẽ về Gmail" }

      - name: "menu"
        label: "Menu (thanh điều hướng)"
        file: "content/menu.json"
        fields:
          - label: "Các mục menu"
            name: "items"
            widget: "list"
            summary: "{{fields.label}}"
            fields:
              - { label: "Tên hiển thị", name: "label", widget: "string" }
              - { label: "Link", name: "link", widget: "string", hint: "VD: du-an.html — hoặc link ngoài đầy đủ https://..." }
              - label: "Mục con (bỏ trống nếu không có)"
                name: "children"
                widget: "list"
                required: false
                summary: "{{fields.label}}"
                fields:
                  - { label: "Tên hiển thị", name: "label", widget: "string" }
                  - { label: "Link", name: "link", widget: "string" }

      - name: "hero"
        label: "Đầu trang chủ (Hero)"
        file: "content/hero.json"
        fields:
          - { label: "Tiêu đề lớn", name: "hero_title", widget: "string" }
          - { label: "Mô tả ngắn", name: "hero_subtitle", widget: "text" }
          - { label: "Nút 1 (chữ)", name: "hero_btn1", widget: "string" }
          - { label: "Nút 1 (link)", name: "hero_btn1_link", widget: "string" }
          - { label: "Nút 2 (chữ)", name: "hero_btn2", widget: "string" }
          - { label: "Nút 2 (link)", name: "hero_btn2_link", widget: "string", required: false, hint: "Để trống = tự dùng link Messenger" }
          - { label: "Poster bên phải (ảnh vuông ~1000x1000)", name: "hero_poster", widget: "image", required: false }
          - label: "4 ô số liệu"
            name: "stats"
            widget: "list"
            max: 4
            fields:
              - { label: "Nhãn", name: "label", widget: "string" }
              - { label: "Số", name: "value", widget: "string" }
          - { label: "Thẻ nổi bật — nhãn nhỏ", name: "highlight_label", widget: "string" }
          - { label: "Thẻ nổi bật — tiêu đề", name: "highlight_title", widget: "string" }
          - { label: "Thẻ nổi bật — dòng 1", name: "highlight_meta1", widget: "string", required: false }
          - { label: "Thẻ nổi bật — dòng 2", name: "highlight_meta2", widget: "string", required: false }
          - { label: "Thẻ nổi bật — nút (chữ)", name: "highlight_btn", widget: "string" }
          - { label: "Thẻ nổi bật — nút (link)", name: "highlight_link", widget: "string" }
          - { label: "Thẻ nổi bật — ảnh (ngang 16:9)", name: "highlight_image", widget: "image", required: false }



      - name: "home"
        label: "Trang chủ (các khối bên dưới)"
        file: "content/home.json"
        fields:
          - { label: "▸ Khối giới thiệu — tiêu đề", name: "about_title", widget: "string" }
          - { label: "Khối giới thiệu — nội dung", name: "about_body", widget: "text" }
          - { label: "Khối giới thiệu — chữ nút", name: "about_btn", widget: "string", required: false }
          - { label: "Khối giới thiệu — link nút", name: "about_btn_link", widget: "string", required: false }
          - { label: "Khối giới thiệu — ảnh", name: "about_image", widget: "image", required: false }

          - { label: "▸ Dịch vụ — tiêu đề", name: "services_title", widget: "string" }
          - { label: "Dịch vụ — mô tả", name: "services_lead", widget: "text" }

          - { label: "▸ Giải pháp — tiêu đề", name: "solutions_title", widget: "string" }
          - label: "Giải pháp theo giai đoạn (thêm/xoá tuỳ ý)"
            name: "solutions"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Tiêu đề", name: "title", widget: "string" }
              - { label: "Mô tả", name: "desc", widget: "text" }
              - { label: "Link khi bấm vào tiêu đề", name: "link", widget: "string", required: false, hint: "Bỏ trống = không bấm được" }

          - { label: "▸ Dự án tiêu biểu — tiêu đề", name: "projects_title", widget: "string" }
          - { label: "Dự án tiêu biểu — chữ nút", name: "projects_btn", widget: "string" }

          - { label: "▸ Ngành đã làm — tiêu đề", name: "industries_title", widget: "string" }
          - { label: "Ngành đã làm — mô tả", name: "industries_lead", widget: "text" }
          - label: "Danh sách ngành (thêm/xoá tuỳ ý)"
            name: "industries"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - { label: "Tên ngành", name: "name", widget: "string" }
              - { label: "Mô tả ngắn", name: "desc", widget: "string" }
              - { label: "Link", name: "link", widget: "string", hint: "VD: du-an.html?cat=fnb" }

          - { label: "▸ Hệ sinh thái TikTok — tiêu đề", name: "tiktok_title", widget: "string" }
          - { label: "TikTok — mô tả", name: "tiktok_lead", widget: "text" }
          - label: "TikTok — các gạch đầu dòng"
            name: "tiktok_items"
            widget: "list"
            summary: "{{fields.text}}"
            fields:
              - { label: "Nội dung", name: "text", widget: "string" }
          - { label: "TikTok — chữ nút", name: "tiktok_btn", widget: "string", required: false }
          - { label: "TikTok — link nút", name: "tiktok_btn_link", widget: "string", required: false }
          - label: "TikTok — 3 ảnh dọc"
            name: "tiktok_images"
            widget: "list"
            fields:
              - { label: "Ảnh (dọc 9:16)", name: "image", widget: "image", required: false }

          - { label: "▸ Gallery — tiêu đề", name: "gallery_title", widget: "string" }
          - { label: "Gallery — chữ nút", name: "gallery_btn", widget: "string", required: false }
          - { label: "Gallery — link nút", name: "gallery_btn_link", widget: "string", required: false }
          - label: "Ảnh gallery (thêm/xoá tuỳ ý)"
            name: "gallery"
            widget: "list"
            summary: "{{fields.caption}}"
            fields:
              - { label: "Chú thích", name: "caption", widget: "string", required: false }
              - { label: "Ảnh", name: "image", widget: "image", required: false }
              - { label: "Link khi bấm vào ảnh", name: "link", widget: "string", required: false, hint: "Bỏ trống = không bấm được" }

          - { label: "▸ Case study — tiêu đề", name: "cases_title", widget: "string" }
          - label: "Case study (thêm/xoá tuỳ ý)"
            name: "cases"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Nhãn ngành", name: "tag", widget: "string", required: false }
              - { label: "Tiêu đề", name: "title", widget: "string" }
              - { label: "Nội dung", name: "desc", widget: "text" }
              - { label: "Chữ nút", name: "btn", widget: "string", required: false }
              - { label: "Link nút", name: "link", widget: "string", required: false }

          - label: "▸ Con số (thêm/xoá tuỳ ý)"
            name: "numbers"
            widget: "list"
            summary: "{{fields.value}} — {{fields.label}}"
            fields:
              - { label: "Số", name: "value", widget: "string" }
              - { label: "Chú thích", name: "label", widget: "string" }

          - { label: "▸ Khách hàng — tiêu đề", name: "clients_title", widget: "string" }
          - label: "Logo khách hàng (thêm/xoá tuỳ ý)"
            name: "clients"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - { label: "Tên", name: "name", widget: "string" }
              - { label: "Logo", name: "logo", widget: "image", required: false }
              - { label: "Link website khách hàng", name: "link", widget: "string", required: false }

          - { label: "▸ Tin tức — tiêu đề", name: "posts_title", widget: "string" }
          - { label: "Tin tức — chữ nút", name: "posts_btn", widget: "string" }

          - { label: "▸ Khối kêu gọi cuối trang — tiêu đề", name: "cta_title", widget: "string" }
          - { label: "Khối kêu gọi — mô tả", name: "cta_lead", widget: "text", required: false }
          - { label: "Khối kêu gọi — chữ nút", name: "cta_btn", widget: "string" }
          - { label: "Khối kêu gọi — link nút", name: "cta_btn_link", widget: "string" }

      - name: "about"
        label: "Trang Giới thiệu"
        file: "content/about.json"
        fields:
          - { label: "Tiêu đề lớn đầu trang", name: "hero_title", widget: "string" }
          - { label: "Mô tả dưới tiêu đề", name: "hero_lead", widget: "text" }
          - { label: "Khối giới thiệu — tiêu đề", name: "about_title", widget: "string" }
          - { label: "Khối giới thiệu — nội dung (chèn ảnh tuỳ ý)", name: "about_body", widget: "markdown" }
          - { label: "Khối giới thiệu — ảnh bên phải", name: "about_image", widget: "image", required: false }
          - { label: "Tầm nhìn — tiêu đề", name: "vision_title", widget: "string" }
          - { label: "Tầm nhìn — nội dung", name: "vision_body", widget: "text" }
          - { label: "Sứ mệnh — tiêu đề", name: "mission_title", widget: "string" }
          - { label: "Sứ mệnh — nội dung", name: "mission_body", widget: "text" }
          - { label: "Năng lực — tiêu đề mục", name: "cap_title", widget: "string" }
          - label: "Năng lực (thêm/xoá tuỳ ý)"
            name: "capabilities"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Tên năng lực", name: "title", widget: "string" }
              - { label: "Mô tả", name: "desc", widget: "text" }
          - { label: "Đội ngũ — tiêu đề mục", name: "team_title", widget: "string" }
          - label: "Thành viên (thêm/xoá tuỳ ý)"
            name: "team"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - { label: "Tên", name: "name", widget: "string" }
              - { label: "Vai trò", name: "role", widget: "string" }
              - { label: "Ảnh (dọc 3:4)", name: "image", widget: "image", required: false }
          - { label: "Khách hàng — tiêu đề mục", name: "clients_title", widget: "string" }
          - label: "Logo khách hàng (thêm/xoá tuỳ ý)"
            name: "clients"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - { label: "Tên khách hàng", name: "name", widget: "string" }
              - { label: "Logo", name: "logo", widget: "image", required: false }

      - name: "services"
        label: "Dịch vụ"
        file: "content/services.json"
        fields:
          - label: "Danh sách dịch vụ"
            name: "services"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Tên dịch vụ", name: "title", widget: "string" }
              - { label: "Mã (không dấu, dùng cho link)", name: "slug", widget: "string" }
              - { label: "Mô tả ngắn", name: "summary", widget: "text" }
              - { label: "Điểm chính", name: "items", widget: "list", required: false, field: { label: "Ý", name: "item", widget: "string" } }
              - { label: "Ảnh đại diện", name: "image", widget: "image", required: false }
              - { label: "Nội dung chi tiết (chèn ảnh tuỳ ý)", name: "body", widget: "markdown", required: false, hint: "Bấm biểu tượng ảnh trên thanh công cụ để chèn hình vào giữa bài" }

  - name: "projects"
    label: "Dự án"
    files:
      - name: "projects"
        label: "Danh sách dự án"
        file: "content/projects.json"
        fields:
          - label: "Dự án"
            name: "projects"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Tên dự án", name: "title", widget: "string" }
              - { label: "Mã (không dấu, dùng cho link)", name: "slug", widget: "string" }
              - label: "Ngành"
                name: "category"
                widget: "select"
                options:
                  - { label: "F&B", value: "fnb" }
                  - { label: "Beauty", value: "beauty" }
                  - { label: "Technology", value: "technology" }
                  - { label: "Wedding", value: "wedding" }
                  - { label: "Fashion", value: "fashion" }
                  - { label: "Education", value: "education" }
                  - { label: "Retail", value: "retail" }
                  - { label: "Personal Brand", value: "personal" }
                  - { label: "Design", value: "design" }
              - { label: "Khách hàng", name: "client", widget: "string", required: false }
              - { label: "Dịch vụ đã làm", name: "services", widget: "list", required: false, field: { label: "Dịch vụ", name: "s", widget: "string" } }
              - { label: "Kết quả (1 dòng)", name: "result", widget: "string", required: false }
              - { label: "Ảnh đại diện", name: "image", widget: "image", required: false }
              - { label: "Link video TikTok/YouTube", name: "video", widget: "string", required: false }
              - { label: "Hiện ở Trang chủ", name: "featured", widget: "boolean", default: false }
              - { label: "Nội dung chi tiết (chèn ảnh tuỳ ý)", name: "body", widget: "markdown", hint: "Bấm biểu tượng ảnh trên thanh công cụ để chèn hình vào giữa bài" }

  - name: "posts"
    label: "Tin tức"
    files:
      - name: "posts"
        label: "Danh sách bài viết"
        file: "content/posts.json"
        fields:
          - label: "Bài viết"
            name: "posts"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Tiêu đề", name: "title", widget: "string" }
              - { label: "Mã (không dấu, dùng cho link)", name: "slug", widget: "string" }
              - { label: "Ngày", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "DD/MM/YYYY", time_format: false }
              - { label: "Chủ đề", name: "tag", widget: "string" }
              - { label: "Tóm tắt", name: "excerpt", widget: "text" }
              - { label: "Ảnh đại diện", name: "image", widget: "image", required: false }
              - { label: "Link video TikTok/YouTube", name: "video", widget: "string", required: false }
              - { label: "Nội dung (chèn ảnh tuỳ ý)", name: "body", widget: "markdown", hint: "Bấm biểu tượng ảnh trên thanh công cụ để chèn hình vào giữa bài" }

  - name: "jobs"
    label: "Tuyển dụng"
    files:
      - name: "jobs"
        label: "Danh sách vị trí"
        file: "content/jobs.json"
        fields:
          - label: "Vị trí tuyển"
            name: "jobs"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Tên vị trí", name: "title", widget: "string" }
              - { label: "Mã (không dấu, dùng cho link)", name: "slug", widget: "string" }
              - { label: "Nơi làm việc", name: "place", widget: "string", required: false }
              - { label: "Hình thức", name: "type", widget: "string", required: false, hint: "VD: Toàn thời gian / Bán thời gian / Thực tập" }
              - { label: "Mức lương", name: "salary", widget: "string", required: false }
              - { label: "Hạn nộp", name: "deadline", widget: "datetime", format: "YYYY-MM-DD", date_format: "DD/MM/YYYY", time_format: false, required: false }
              - { label: "Đang tuyển", name: "open", widget: "boolean", default: true }
              - { label: "Mô tả ngắn", name: "excerpt", widget: "text", required: false }
              - { label: "Ảnh", name: "image", widget: "image", required: false }
              - { label: "Mô tả công việc (chèn ảnh tuỳ ý)", name: "body", widget: "markdown", hint: "Bấm biểu tượng ảnh trên thanh công cụ để chèn hình vào giữa bài" }
